spring.application.name=MCQ-Test

# ===============================
# =   Database Configuration    =
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/MCQ_DB
spring.datasource.username=root
spring.datasource.password=root0909
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# =   JPA / Hibernate Settings  =
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE


# Optional: format SQL output
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# =   Server Port (Optional)   =
# ===============================
 server.port=8080


user.service.url=http://localhost:8080/users
area.service.url=http://localhost:8080/skillmgmt/skills/
material.service.url=http://localhost:8080/api/materials/
